# All secrets come from .env (see .env.example); nothing is hardcoded here.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Published on localhost only, for migrations and tests from the host.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    # One-shot job: applies migrations, then exits. The app waits for it.
    # Reuses the image built for app instead of building its own copy.
    image: deribit-price-tracker:latest
    pull_policy: never
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    image: deribit-price-tracker:latest
    env_file: .env
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    # Celery worker with embedded beat (--beat): one process schedules and
    # runs the task. Scale the worker only after moving beat out of it,
    # otherwise each copy schedules its own task runs.
    image: deribit-price-tracker:latest
    pull_policy: never
    env_file: .env
    command:
      - python
      - -m
      - deribit_price_tracker.worker
      - worker
      - --beat
      - --concurrency=1
      # The app user cannot write to /app, beat keeps its state in /tmp.
      - --schedule=/tmp/celerybeat-schedule
      - --loglevel=INFO
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
