[project]
name = "deribit-price-tracker"
version = "0.1.0"
description = ""
authors = [
    {name = "rudich",email = "rudi4.clarinet@mail.ru"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "celery[redis] (>=5.6.3,<6.0.0)",
    "aiohttp (>=3.14.5,<4.0.0)",
    "sqlalchemy[asyncio] (>=2.1.4,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "ruff (>=0.17.0,<0.18.0)",
    "httpx2 (>=2.13.1,<3.0.0)",
]

[tool.ruff]
line-length = 80
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
